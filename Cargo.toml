[workspace]
members = [
    "crates/gfe-core",
    "crates/gfe-observability",
    "crates/gfe-router",
    "crates/gfe-upstream",
    "crates/gfe-proxy",
    "crates/gfe-config",
    "crates/gfe-node",
    "crates/gfe-health-checking",
    "crates/gfe-controller",
    "crates/gfe-loadtest",
    # Kernel-side view of the node's TCP connections (eBPF, Linux only).
    "crates/gfe-ebpf",
    # Passing a node's listening sockets to its successor (Unix only).
    "crates/gfe-handover",
    # Crates are added to this list as they are implemented (see roadmap in
    # .docs/spec.md). The full set: gfe-observability, gfe-router,
    # gfe-upstream, gfe-proxy, gfe-health-checking, gfe-config, gfe-controller,
    # gfe-node.
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Internal workspace crates, not crates.io publications.
publish = false
# Minimum supported Rust version (floor, not target). CI tracks stable.
rust-version = "1.88"

# The workspace's own code contains no `unsafe`: what needs it (system calls,
# eBPF maps) goes through crates whose job that is. Enforced, so that it
# stays a decision and does not become an accident.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Workspace crates
gfe-core = { path = "crates/gfe-core" }
gfe-observability = { path = "crates/gfe-observability" }
gfe-router = { path = "crates/gfe-router" }
gfe-upstream = { path = "crates/gfe-upstream" }
gfe-proxy = { path = "crates/gfe-proxy" }
gfe-health-checking = { path = "crates/gfe-health-checking" }
gfe-config = { path = "crates/gfe-config" }
gfe-controller = { path = "crates/gfe-controller" }
gfe-ebpf = { path = "crates/gfe-ebpf" }
gfe-handover = { path = "crates/gfe-handover" }

# Async runtime
tokio = { version = "1", features = ["full"] }
# Socket options tokio does not expose (TCP keepalive). Already in the tree
# through tokio.
socket2 = "0.6"

# HTTP server + client
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "webpki-tokio", "tls12", "logging"] }
http = "1"
http-body-util = "0.1"
# The connector trait hyper-util's client is generic over; needed to wrap the
# upstream connector with the connection limit.
tower-service = "0.3"
bytes = "1"

# TLS. Pin the `ring` crypto provider (default-features off) so we avoid the
# aws-lc-rs C/cmake build; this keeps the build to "Rust + a C compiler for
# ring's asm" only, matching lb's commodity-build philosophy.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
x509-parser = "0.16"
rcgen = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# Hands log lines to a writer thread, so that a slow log never slows a request.
tracing-appender = "0.2"

# Metrics
prometheus-client = "0.23"

# CLI
clap = { version = "4", features = ["derive"] }

# Concurrency
arc-swap = "1"
dashmap = "6"

# File watching (hot reload)
notify = "7"

# eBPF, user-space side: loads the kernel programs and reads their maps. Pure
# Rust (no libbpf, no libelf), so static musl builds keep working. Linux only.
aya = "0.14"
# The monotonic clock the kernel stamps its events with (safe wrapper).
rustix = { version = "1", features = ["time"] }

# Async traits
async-trait = "0.1"

# Utilities
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
