# systemd drop-in for the kernel TCP statistics (`[ebpf] enabled = true` in
# gfe.toml). Install as:
#
#     /etc/systemd/system/gfe-node.service.d/ebpf.conf
#
# then `systemctl daemon-reload` and restart the node.
#
# The base unit gives the node one capability, binding low ports, and blocks
# privileged system calls. Loading the eBPF program needs two more
# capabilities and the bpf() system call. That is a real widening of what a
# compromised node could do (CAP_NET_ADMIN can reconfigure the host's
# network), which is why it is a deliberate, separate step.
#
# Without this drop-in a node with `[ebpf] enabled = true` logs that it is
# not permitted to load eBPF and runs without the kernel statistics.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_BPF CAP_NET_ADMIN
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_BPF CAP_NET_ADMIN
SystemCallFilter=bpf
