[package]
name = "gfe-node"
description = "The binary a node runs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gfe-config = { workspace = true }
gfe-core = { workspace = true }
gfe-observability = { workspace = true }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `net`: passing the listening sockets to a successor. `process`: replacing
# the running node.
rustix = { workspace = true, features = ["net", "process"] }

[dev-dependencies]
rcgen = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
