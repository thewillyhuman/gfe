# GFE Node Configuration (bootstrap)
# Deserialized by gfe-config (NodeConfig, in gfe-config/src/node.rs).
#
# The hot-reloadable part (listeners, routes, pools, certificates) lives in the
# JSON file referenced by [control_plane].config_file — see
# gfe-dynamic.example.json, next to this file.

[node]
id            = "gfe-node-01"
metrics_addr  = "127.0.0.1:9101"      # /healthz, /readyz, /metrics; use 0.0.0.0:9101 for remote scrape
worker_threads = 0                     # 0 = Tokio default (= number of CPUs)

[control_plane]
config_file     = "/etc/gfe/gfe-dynamic.json"       # listeners/routes/pools/certs; watched via inotify
local_cache     = "/var/lib/gfe/config-cache.json"  # last-known-good; the unit's StateDirectory (not /tmp: PrivateTmp)
reload_debounce = "250ms"

[tls]
min_version = "1.2"                     # "1.2" or "1.3"
hsts        = "max-age=31536000; includeSubDomains"
# ticket_key_file = "/etc/gfe/tls-ticket-keys"   # fleet-shared resumption keys (accepted, not used yet)

# Every limit must be greater than 0: 0 is not "unlimited", it refuses
# everything. Leave a setting out to use its default.
[limits]
max_connections           = 100000
max_connections_listener  = 50000
max_header_bytes          = 65536    # request head limit (431 above it); minimum 8192
max_h2_concurrent_streams = 256
max_upstream_connections  = 20000    # open upstream connections, all backends together (503 above it)
# client_connections_per_second = 100 # new connections one client address may open per second, over all
                                     # listeners (a client that has been quiet may open a second's worth at
                                     # once); a connection above it is closed as soon as it is accepted
                                     # (gfe_connections_rejected_total{reason="client_rate"}); absent: no cap

# Every timeout must be greater than "0s", which would expire at once.
[timeouts]
tls_handshake       = "10s"
request_header      = "10s"   # first request head must arrive within this of connecting
upstream_connect    = "3s"    # lookup, TCP and TLS handshake together
upstream_first_byte = "30s"   # backend must start its response within this of last being sent
                              # something (the request, or a piece of its body): 504 otherwise;
                              # a response that has started is never cut
request_total       = "60s"   # once the request is sent in full, a response must arrive
                              # within this, however many backends are tried
                              # (gRPC calls are bounded by their client's deadline instead)
client_idle         = "75s"   # close a connection with no request in flight for this long;
                              # also probe a client silent this long (TCP keepalive)
drain_deadline      = "30s"   # on shutdown: how long open connections get to finish; one with no
                              # request in flight is closed after half of it

[upstream]
# idle_per_host  = 32         # most idle pooled connections kept per backend; unset or 0 keeps
                              # every one (bounded by idle_timeout and max_upstream_connections)
idle_timeout     = "60s"      # close a pooled upstream connection idle for this long
# client_cert_file = "/etc/gfe/upstream-client.pem"   # mTLS: the certificate shown to https backends
# client_key_file  = "/etc/gfe/upstream-client.key"
# extra_ca_file    = "/etc/gfe/upstream-ca.pem"       # trusted for https backends, besides the system's CAs

# Where the log goes. With a file, every line is appended to it and standard
# output (the journal, under systemd) keeps the node's own log only: the
# per-request and per-connection events are too many for a journal, which
# discards what exceeds its rate limit. Without one, everything goes to
# standard output.
#
# Nothing here rotates the file: point a log collector or logrotate at it.
# It may be renamed, removed or truncated under the node, which goes on at
# this path within a second. The systemd unit provides /var/log/gfe.
[log]
file = "/var/log/gfe/gfe.log"

[health_check_defaults]
type                = "http"       # http (TLS for https pools) | https | tcp | grpc (grpc.health.v1, for gRPC pools)
interval            = "5s"
timeout             = "2s"
healthy_threshold   = 2
unhealthy_threshold = 3
path                = "/healthz"
