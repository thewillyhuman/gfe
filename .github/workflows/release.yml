name: release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Produces:
#   * GitHub Release with auto-generated release notes
#   * x86_64 + aarch64 Linux binaries (statically linked against musl)
#   * x86_64 + aarch64 RPMs built from those binaries (see docs/rpm.md)
#   * `gfe-node` container image for both architectures, built from those
#     binaries and pushed to `ghcr.io/${owner}/gfe-node`
#
# To cut a release:
#   git tag -a v0.1.0 -m "0.1.0"
#   git push origin v0.1.0
#
# We do NOT run on every push to main — releases are explicit.
#
# No job here uses a cache, unlike in ci.yml: a cache saved by the run of a
# tag can only be read by runs of that same tag, so each release would write
# caches that no later release can use.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # create release + upload artifacts
  packages: write    # push to ghcr.io

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag can be pushed on any commit, including one CI never saw: nothing is
  # published before the tests have passed on exactly that commit. The build
  # runs next to them and publishes nothing; the image and the release wait.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The same two steps as the test job of ci.yml.
      - name: cargo nextest run --locked --workspace
        working-directory: src/rust
        run: cargo nextest run --locked --workspace --no-fail-fast --failure-output immediate-final
      - name: cargo test --locked --workspace --doc
        working-directory: src/rust
        run: cargo test --locked --workspace --doc

  build-binaries:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # Each target is built on a runner of its own architecture: the
        # tools the build needs are the distribution's own, and the result
        # can be run before it is published.
        include:
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the C toolchains
        # musl-gcc compiles the C and assembly of the TLS library for the
        # musl target. clang compiles the kernel program of `gfe-ebpf`:
        # without it the build succeeds, and the binary has no kernel TCP
        # statistics in it. It needs kernel headers that know the ring
        # buffer (5.8), which this distribution has.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools clang
      - name: Build gfe-node
        working-directory: src/rust
        run: cargo build --release --locked --target ${{ matrix.target }} --bin gfe-node
      - name: Run the built binary
        # Catches a binary that links but does not start.
        run: src/rust/target/${{ matrix.target }}/release/gfe-node --version
      - name: Package
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          cp src/rust/target/${{ matrix.target }}/release/gfe-node "$stage/"
          cp src/systemd/gfe-node.service "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          tarball="gfe-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$tarball" -C "$stage" .
          sha256sum "$tarball" > "$tarball.sha256"
          echo "ARTIFACT=$tarball" >> "$GITHUB_ENV"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          retention-days: 7

  # The RPMs are built here and not next to the binaries so that the image
  # does not wait for the packaging tool, which takes longer to compile than
  # the packages take to build. This job and the image run side by side, and
  # the tool is compiled once for both architectures.
  build-rpm:
    name: rpm packages
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-unknown-linux-musl'
          path: dist
      - name: Install cargo-generate-rpm
        # From source: its authors publish no binaries.
        run: cargo install cargo-generate-rpm --locked
      - name: Build the RPMs
        # Packages the binaries of the tarballs; no rpmbuild involved. The
        # tool only reads files, so one machine builds the packages of both
        # architectures. The RPM version is the tag, with a pre-release dash
        # turned into RPM's `~`.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version//-/\~}"
          mkdir rpms
          # The tool runs from the Cargo workspace.
          cd src/rust
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            # Where `cargo generate-rpm --target` looks for the binary.
            mkdir -p "target/$target/release"
            tar -xzf ../../dist/"$target"/gfe-*.tar.gz -C "target/$target/release" ./gfe-node
            cargo generate-rpm -p gfe-node --target "$target" -s "version = '${version}'"
            mv "target/$target"/generate-rpm/gfe-*.rpm ../../rpms/
          done
          # Written from the RPMs' directory, so that each checksum names
          # the file alone: it is checked next to a downloaded RPM.
          cd ../../rpms
          for rpm in gfe-*.rpm; do
            sha256sum "$rpm" > "$rpm.sha256"
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: rpms/
          retention-days: 7

  build-image:
    name: container image
    runs-on: ubuntu-latest
    needs: [test, build-binaries]
    steps:
      - uses: actions/checkout@v4
      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-unknown-linux-musl'
          path: dist
      - name: Unpack the binaries
        # The image carries the binaries of the tarballs: nothing is compiled
        # here. The Dockerfile looks for each one under Docker's name for
        # its architecture.
        run: |
          set -euo pipefail
          unpack() {
            mkdir -p "prebuilt/$2"
            tar -xzf dist/"$1"-unknown-linux-musl/gfe-*.tar.gz -C "prebuilt/$2" ./gfe-node
          }
          unpack x86_64 amd64
          unpack aarch64 arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        # The arm64 image runs the few commands of its runtime stage
        # (apt-get, useradd) under emulation.
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gfe-node
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY=prebuilt
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [test, build-binaries, build-image, build-rpm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so the release-notes generator sees prior tags
      # The artifacts are downloaded by name. The image build leaves one of
      # its own in the run (its build record), which is not a zip:
      # downloading everything fails on it.
      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-unknown-linux-musl'
          path: dist
      - name: Download the RPMs
        uses: actions/download-artifact@v4
        with:
          name: rpms
          path: dist/rpms
      - name: Flatten artifact layout
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.rpm' -o -name '*.sha256' \) -exec mv {} out/ \;
          ls -la out/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
