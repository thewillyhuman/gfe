name: release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Produces:
#   * GitHub Release with auto-generated release notes
#   * x86_64 + aarch64 Linux binaries (statically linked against musl)
#   * x86_64 + aarch64 RPMs built from those binaries (see packaging/rpm/)
#   * `gfe-node` container image pushed to `ghcr.io/${owner}/gfe-node`
#
# To cut a release:
#   git tag -a v0.1.0 -m "0.1.0"
#   git push origin v0.1.0
#
# We do NOT run on every push to main — releases are explicit.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # create release + upload artifacts
  packages: write    # push to ghcr.io

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag can be pushed on any commit, including one CI never saw: nothing is
  # built for release before the tests have passed on exactly that commit.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo test --locked --workspace
        run: cargo test --locked --workspace

  build-binaries:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cross
        # `cross` handles the musl + aarch64 linker setup so the workflow
        # doesn't have to install qemu/gcc-aarch64 by hand.
        run: cargo install cross --locked --version ^0.2
      - name: Build gfe-node
        run: cross build --release --locked --target ${{ matrix.target }} --bin gfe-node
      - name: Build gfe-trace
        run: cross build --release --locked --target ${{ matrix.target }} --bin gfe-trace
      - name: Run the built binaries
        # The runner is x86_64: only that build can be executed here. It
        # catches a binary that links but does not start.
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/gfe-node --version
          target/${{ matrix.target }}/release/gfe-trace --help > /dev/null
      - name: Package
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          cp target/${{ matrix.target }}/release/gfe-node "$stage/"
          cp target/${{ matrix.target }}/release/gfe-trace "$stage/"
          cp deploy/gfe-node.service "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          tarball="gfe-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$tarball" -C "$stage" .
          sha256sum "$tarball" > "$tarball.sha256"
          echo "ARTIFACT=$tarball" >> "$GITHUB_ENV"
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build RPM
        # Packages the binaries built above; no rpmbuild involved. The RPM
        # version is the tag, with a pre-release dash turned into RPM's `~`.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version//-/\~}"
          cargo generate-rpm -p crates/gfe-node --target ${{ matrix.target }} \
            -s "version = '${version}'"
          rpm=$(ls target/${{ matrix.target }}/generate-rpm/gfe-*.rpm)
          sha256sum "$rpm" > "$rpm.sha256"
          echo "RPM=$rpm" >> "$GITHUB_ENV"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
            ${{ env.RPM }}
            ${{ env.RPM }}.sha256
          retention-days: 7

  build-image:
    name: container image
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU (for arm64 build)
        uses: docker/setup-qemu-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gfe-node
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so the release-notes generator sees prior tags
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact layout
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.rpm' -o -name '*.sha256' \) -exec mv {} out/ \;
          ls -la out/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
