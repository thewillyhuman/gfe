name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # `--locked` everywhere: CI must build what Cargo.lock says, as the
      # release does, so a lockfile that no longer matches fails here and not
      # at tag time.
      - name: cargo clippy --locked --workspace --all-targets -- -D warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Tests are the source of truth — run the whole workspace on every PR.
      # GFE is a pure-userspace proxy (tokio + hyper + rustls/ring), so there
      # are no platform-gated features to toggle here.
      - name: cargo build --locked --workspace --all-targets
        run: cargo build --locked --workspace --all-targets --verbose
      - name: cargo test --locked --workspace
        run: cargo test --locked --workspace --verbose

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Catches broken doc links / examples without publishing anything.
      - name: cargo doc --locked --workspace --no-deps
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        # 0.16.4+ pulls in rustsec >= 0.30 which understands CVSS v4.0 vectors.
        run: cargo install cargo-deny --locked --version '>=0.16.4'
      # Advisories, licenses, bans and sources, as configured in `deny.toml`.
      # Also run weekly by supply-chain.yml, but a scheduled workflow is
      # switched off by GitHub when a repository goes quiet; this one is not.
      - name: cargo deny check
        run: cargo deny check
