[package]
name = "netkit-tls"
description = "TLS in both directions: terminating it for clients, originating it towards servers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# No dependency on netkit-observability: this crate records no metric. What it
# observes is returned (`TlsInfo`, `HandshakeError::reason`) or counted where
# the caller can read it (`SniResolver::miss_count`), and the caller turns
# that into metrics and logs.
[dependencies]
arc-swap = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rcgen = { workspace = true }

[[bench]]
name = "handshake"
harness = false

[lints]
workspace = true
