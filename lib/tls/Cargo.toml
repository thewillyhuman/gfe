[package]
name = "netkit-tls"
description = "TLS termination: certificates by SNI, the TLS policy, the handshake"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# No dependency on gfe-observability: this crate records no metric. What it
# observes is returned (`TlsInfo`, `HandshakeError::reason`) or counted where
# the caller can read it (`SniResolver::miss_count`), and the edge in
# gfe-core turns that into metrics and logs.
[dependencies]
gfe-config = { workspace = true }
arc-swap = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rcgen = { workspace = true }

[[bench]]
name = "handshake"
harness = false

[lints]
workspace = true
